// ==================================================
// CS2 COMPETITIVE MATCH CONFIG
// Plac era denna fil på din CS2 server: csgo/cfg/match.cfg
// ==================================================

// Basic Server Settings
hostname "Safe Gaming Cup Server"
sv_cheats 0
sv_lan 0
mp_autoteambalance 0
mp_limitteams 0
mp_teamname_1 "Team A"
mp_teamname_2 "Team B"

// Match Settings (MR12 - CS2 Standard)
mp_maxrounds 24
mp_roundtime 1.92
mp_roundtime_defuse 1.92
mp_freezetime 15
mp_buytime 20
mp_buy_anywhere 0
mp_startmoney 800

// Overtime Settings
mp_overtime_enable 1
mp_overtime_maxrounds 6
mp_overtime_startmoney 10000
mp_overtime_halftime_pausetimer 1

// Warmup
mp_do_warmup_period 1
mp_warmuptime 60
mp_warmup_pausetimer 1

// Timeouts
mp_team_timeout_max 4
mp_team_timeout_time 30

// Economy
mp_maxmoney 16000
mp_death_drop_gun 1
mp_death_drop_grenade 2
mp_death_drop_defuser 1

// Damage
mp_friendlyfire 1
ff_damage_reduction_bullets 0.33
ff_damage_reduction_grenade 0.85
ff_damage_reduction_other 0.4

// Bots
bot_quota 0
bot_quota_mode "normal"
bot_difficulty 3
bot_chatter "off"
bot_join_after_player 0

// Spectator
mp_forcecamera 1
sv_spec_hear 1

// Logging
log on
sv_logbans 1
sv_logecho 1
sv_logfile 1
sv_log_onefile 0

// Broadcasting/GOTV
tv_enable 1
tv_delay 30
tv_advertise_watchable 0

// Say server is ready
say "Match configuration loaded - Server ready!"

// ==================================================
// KNIFE ROUND CONFIG
// File: csgo/cfg/knife.cfg
// ==================================================

mp_do_warmup_period 0
mp_warmuptime 0
mp_freezetime 5
mp_roundtime 1
mp_maxrounds 1
mp_startmoney 0
mp_buytime 0
mp_give_player_c4 0
mp_weapons_allow_map_placed 0

// Remove all weapons except knife
mp_weapons_allow_zeus 0
mp_ct_default_secondary ""
mp_ct_default_primary ""
mp_t_default_secondary ""
mp_t_default_primary ""
mp_ct_default_grenades ""
mp_t_default_grenades ""

say "Knife round - Winner chooses side!"

// ==================================================
// LIVE CONFIG (After knife round)
// File: csgo/cfg/live.cfg
// ==================================================

mp_do_warmup_period 0
mp_freezetime 15
mp_roundtime 1.92
mp_roundtime_defuse 1.92
mp_maxrounds 24
mp_startmoney 800
mp_buytime 20

// Restore weapon settings
mp_weapons_allow_map_placed 1
mp_give_player_c4 1
mp_ct_default_secondary "weapon_hkp2000"
mp_ct_default_primary ""
mp_t_default_secondary "weapon_glock"
mp_t_default_primary ""

mp_restartgame 1

say "*** LIVE LIVE LIVE ***"
say "*** LIVE LIVE LIVE ***"
say "*** LIVE LIVE LIVE ***"

// ==================================================
// WARMUP CONFIG
// File: csgo/cfg/warmup.cfg
// ==================================================

mp_do_warmup_period 1
mp_warmuptime 300
mp_warmup_pausetimer 1
mp_freezetime 0
mp_roundtime 60
mp_maxrounds 1
mp_startmoney 16000
mp_buytime 999
mp_buy_anywhere 1
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1
mp_respawn_immunitytime 0
sv_infinite_ammo 2
mp_free_armor 2
ammo_grenade_limit_total 5

say "Warmup active - Unlimited money and ammo"